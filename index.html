<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBurger - Lanchonete</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>👨🏻‍💻 DevBurger 🍔</h1>
        <p>O melhor hambúrguer do curso DevMobile!</p>
    </header>

    <main class="container" >
        <section class="instrucoes">
            <h2>🛒 Simulador de Compras 🛒</h2>
            <br>
            <p>Clique no botão abaixo para fazer seu pedido.</p>
            <br>
            <button onclick="simularCompra()">Simular Compra</button>
        </section>

        <section class="produtos">
            <div class="card-produto">
                <h3>🍔 X-Burguer</h3>
                <p>Hambúrguer de carne, alface e tomate</p>
                <span>19,99</span>
            </div>

            <div class= "card-produto">
                <h3>🍟 Batata Frita</h3>
                <p>Porção de batata frita </p>
                <span>R$9,99</span>
            </div>

            <div class="card-produto">
                <h3>🥤 Refrigerante</h3>
                <p>Refrigerante 350ml</p>
                <span>R$4,99</span>
            </div>

        </section>
    </main>
    <script src="/script.js"></script>
</body>
</html>
